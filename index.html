<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CP4 Viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra superior com troca App/Central; App = celular centralizado + roteiro de demo; Central = menu lateral + tela */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#F7FAF8; --line:#DCE3DF; --line-2:#C9D3CE;
  --fg:#0F1E1B; --muted:#4A5A56;
  --accent:#0B6B5E; --accent-fg:#FFFFFF; --accent-soft:#E3F1EC; --accent-ink:#084C43;
  --deep:#0F1E1B; --deep-2:#1C2F2B; --deep-3:#2A3D39; --deep-fg:#FFFFFF; --deep-muted:#B9C7C2; --mint:#7EE0BF;
  --ok:#146C43; --ok-bg:#E6F4EC; --warn:#8A4B00; --warn-bg:#FDF1E2; --bad:#B42318; --bad-bg:#FDECEA; --info:#3346A6; --info-bg:#E8EEFD;
  --amber:#E8A33D; --blue:#5B7BD5; --stone:#9FB3AC; --track:#E3EAE6;
  --display:'Bricolage Grotesque','Trebuchet MS',sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1513; --surface:#13201D; --surface-2:#182824; --line:#26352F; --line-2:#34463F;
  --fg:#E6EEEA; --muted:#9DB0A9;
  --accent:#3FB7A0; --accent-fg:#062520; --accent-soft:#123A33; --accent-ink:#9FE3D2;
  --deep:#08110F; --deep-2:#16241F; --deep-3:#24352F; --deep-fg:#F2F7F5; --deep-muted:#A9BAB4; --mint:#7EE0BF;
  --ok:#7FD6A3; --ok-bg:#133524; --warn:#F2B866; --warn-bg:#3A2A12; --bad:#F59A90; --bad-bg:#3E1A17; --info:#A9BAF5; --info-bg:#1C2748;
  --stone:#5F736C; --track:#24352F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1513; --surface:#13201D; --surface-2:#182824; --line:#26352F; --line-2:#34463F;
  --fg:#E6EEEA; --muted:#9DB0A9;
  --accent:#3FB7A0; --accent-fg:#062520; --accent-soft:#123A33; --accent-ink:#9FE3D2;
  --deep:#08110F; --deep-2:#16241F; --deep-3:#24352F; --deep-fg:#F2F7F5; --deep-muted:#A9BAB4; --mint:#7EE0BF;
  --ok:#7FD6A3; --ok-bg:#133524; --warn:#F2B866; --warn-bg:#3A2A12; --bad:#F59A90; --bad-bg:#3E1A17; --info:#A9BAF5; --info-bg:#1C2748;
  --stone:#5F736C; --track:#24352F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:var(--deep-fg);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:#0B6B5E;color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.5px;flex-shrink:0}
.brand b{font-family:var(--display);font-size:19px}
.brand span{font-size:12px;color:var(--deep-muted)}
.seg{display:flex;background:var(--deep-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--deep-muted);min-height:40px;padding:0 16px;border-radius:9px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:#0B6B5E;color:#fff}

/* ===== APP ===== */
.appwrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px 16px 48px;flex-wrap:wrap}
.phone{width:390px;max-width:100%;height:800px;border-radius:40px;border:10px solid var(--deep);background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(8,30,26,.18)}
.ph-head{background:var(--deep);color:var(--deep-fg);padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;flex-shrink:0}
.ph-row{display:flex;align-items:center;justify-content:space-between}
.avatar{width:44px;height:44px;border-radius:22px;border:1px solid var(--deep-3);background:var(--deep-2);color:var(--deep-fg);font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hchip{padding:6px 10px;border-radius:999px;background:var(--deep-2);font-size:13px;font-weight:600}
.ph-main{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.focus{border:2px solid var(--accent)}
.card.deep{background:var(--deep);color:var(--deep-fg);border-color:var(--deep)}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.deep .eyebrow{color:var(--mint)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;align-self:flex-start}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}.acc{background:var(--accent-soft);color:var(--accent-ink)}.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.deep .bar{background:var(--deep-3)}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:15px;padding:0 16px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border:0;min-height:56px;font-size:17px}
.btn.sm{min-height:36px;border-radius:9px;font-size:13px;padding:0 12px}
.btn.primary.sm{min-height:36px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.photo{min-height:80px;border:2px dashed var(--stone);border-radius:14px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500;font-size:15px;cursor:pointer;padding:8px;text-align:center}
.photo.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.stop{display:flex;gap:12px}
.stop .rail{display:flex;flex-direction:column;align-items:center;width:16px}
.stop .dot{width:14px;height:14px;border-radius:7px;border:2px solid var(--stone);background:var(--surface);margin-top:3px;flex-shrink:0}
.stop .ln{width:2px;flex:1;background:var(--line);margin:2px 0}
.stop.done .dot{background:var(--accent);border-color:var(--accent)}.stop.done .ln{background:var(--accent)}
.stop.cur .dot{border-color:var(--accent)}.stop.cur .place{color:var(--accent)}
.stop .body{flex:1;display:flex;justify-content:space-between;gap:8px;padding-bottom:14px}
.stop .place{font-weight:600;font-size:16px}
.small{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-height:72px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;font-size:15px;text-align:left}
.tile svg{color:var(--accent);flex-shrink:0}
.exp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.exp.tap{cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.big{font-family:var(--display);font-size:48px;font-weight:700;line-height:1}
.jbtn{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:16px;font-weight:600}
.jbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.timeline{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.doc{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph-nav{height:76px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--line);display:flex}
.ph-nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:13px;font-weight:600;border-top:3px solid transparent}
.ph-nav button[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}
.sheet-bg{position:absolute;inset:0;background:rgba(8,20,18,.55);display:flex;flex-direction:column;justify-content:flex-end;z-index:5}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h3{font-family:var(--display);font-size:22px}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:var(--surface-2);display:grid;place-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.inp{min-height:48px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;font-size:17px;background:var(--surface);width:100%}
.chipset{display:flex;gap:8px;flex-wrap:wrap}
.chipset button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:500}
.chipset button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.hint{font-size:14px;line-height:20px;color:var(--accent-ink);background:var(--accent-soft);padding:10px 12px;border-radius:10px}
.toast{position:absolute;left:14px;right:14px;bottom:88px;background:var(--deep);color:var(--deep-fg);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.demo{width:340px;max-width:100%;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.demo h2{font-family:var(--display);font-size:26px}
.demo ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;color:var(--muted)}
.demo li b{color:var(--fg)}
.demo .note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* ===== CENTRAL ===== */
.central{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 56px)}
.side{background:var(--deep);color:var(--deep-fg);padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side button{min-height:44px;border:0;background:transparent;color:var(--deep-muted);text-align:left;padding:0 12px;border-radius:10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.side button[aria-current="page"]{background:var(--deep-2);color:var(--deep-fg);font-weight:600}
.side .badge{font-size:12px;background:var(--bad);color:var(--surface);border-radius:999px;padding:1px 8px;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--deep-muted);padding:12px}
.screen{padding:26px 28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.shead h1{font-family:var(--display);font-size:30px;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:30px}
.cols{display:grid;gap:18px;align-items:start}
.cols.prog{grid-template-columns:minmax(0,360px) minmax(0,1fr) minmax(0,320px)}
.cols.side-r{grid-template-columns:minmax(0,1fr) minmax(0,340px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.deep{background:var(--deep);color:var(--deep-fg);border-color:var(--deep)}
.panel.deep .small{color:var(--deep-muted)}
.panel h2{font-size:16px;font-weight:600}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv.total{border-top:1px solid var(--line);padding-top:10px;font-weight:600}
.deep .kv.total{border-color:var(--deep-3)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.hot td{background:var(--bad-bg)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mini{height:6px;background:var(--track);border-radius:3px;margin-top:4px;width:120px}
.mini i{display:block;height:100%;border-radius:3px}
.route{display:flex;flex-direction:column;font-size:14px}
.route .r{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:36px}
.route .r.stopr{min-height:42px;font-weight:600}
.route .r.pause{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding-right:8px}
.route .m{justify-self:center;width:8px;height:8px;border-radius:2px;background:var(--stone)}
.route .stopr .m{width:14px;height:14px;border-radius:7px;background:var(--accent)}
.route .pause .m{background:var(--amber);border-radius:4px}
.route .ff .m{background:var(--blue)}
.check{display:flex;gap:10px;align-items:flex-start}
.fieldbox{min-height:48px;border:1px solid var(--line-2);border-radius:10px;padding:0 12px;background:var(--surface);width:100%;font-size:15px}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--line-2);padding:3px;display:flex;flex-shrink:0}
.switch i{width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] i{transform:translateX(22px)}
.alert{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;font-size:14px}
.alert.crit{border-color:var(--bad)}.alert.w{border-color:var(--warn)}
.alert .t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.alert.crit .t{color:var(--bad)}.alert.w .t{color:var(--warn)}
.banner{border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
pre.code{margin:0;background:var(--deep);color:var(--deep-fg);border-radius:12px;padding:16px;font-family:var(--mono);font-size:12.5px;line-height:1.55;overflow-x:auto}
.flow{display:grid;grid-template-columns:minmax(0,220px) 24px minmax(0,220px) minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.flow:last-child{border-bottom:0}.flow .node{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px}.flow .arrow{text-align:center;color:var(--muted);font-size:18px}
@media (max-width:700px){.flow{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr)}.flow .small{grid-column:1/-1}}
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;overflow-x:auto}
.ctoast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--deep);color:var(--deep-fg);border-radius:12px;padding:12px 16px;font-size:14px;z-index:30;display:flex;gap:10px;align-items:center;max-width:calc(100% - 40px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

@media (max-width:1180px){.cols.prog{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cols.prog>:last-child{grid-column:1/-1}}
@media (max-width:860px){
  .central{grid-template-columns:minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;padding:8px 16px;gap:6px}
  .side button{white-space:nowrap;flex-shrink:0}
  .side .foot{display:none}
  .screen{padding:20px 16px 40px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols.prog,.cols.side-r{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:440px){
  .appwrap{padding:0 0 24px}
  .phone{border:0;border-radius:0;height:calc(100vh - 110px);min-height:640px}
  .demo{padding:0 16px}
  .top .brand span{display:none}
}
</style>
</head>
<body>


<header class="top">
  <div class="brand"><div class="mark">CP4</div><div style="display:flex;flex-direction:column;line-height:1.1"><b>Viagens</b><span>Protótipo navegável · dados fictícios</span></div></div>
  <div class="seg" role="group" aria-label="Alternar visão">
    <button data-a="mode" data-v="app" id="seg-app">App do motorista</button>
    <button data-a="mode" data-v="central" id="seg-central">Central do gestor</button>
  </div>
</header>
<div id="root"></div>

<script>
(function(){
var I = {
  pin:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  receipt:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  clock:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  fuel:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16"/><path d="M3 21h13"/><path d="M6 8h7"/><path d="M15 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>',

var tt;
function ctoast(m){S.ctoast=m;render();clearTimeout(tt);tt=setTimeout(function(){S.ctoast='';render();},3500);}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]'); if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;
  var a=el.getAttribute('data-a'), v=el.getAttribute('data-v');
  if(a==='closeSheetBg'&&ev.target!==el)return;
  switch(a){
    case 'mode': S.mode=v; try{localStorage.setItem('cp4v-mode',v);}catch(e){} render(); window.scrollTo(0,0); break;
    case 'goCentral': S.mode='central'; S.screen=v; render(); window.scrollTo(0,0); break;
    case 'tab': set({tab:v}); break;
    case 'arrive': set({phase:'local',canhoto:false}); break;
    case 'deliver': set({step:S.step+1,phase:'caminho',canhoto:false,toast:'Entrega confirmada com canhoto'}); break;
    case 'finish': set({done:true,jornada:'descanso',toast:'Viagem enviada para fechamento'}); break;
    case 'resetTrip': set({step:2,phase:'caminho',done:false,jornada:'dirigindo',aprovado:false,toast:''}); break;
    case 'toast': S._keep=true; set({toast:v}); break;
    case 'closeToast': S._keep=true; set({toast:''}); break;
    case 'sheet': S._keep=true; set({sheet:v,valor:'',opt:0,receipt:false}); break;
    case 'closeSheet': case 'closeSheetBg': S._keep=true; set({sheet:null}); break;
    case 'opt': S._keep=true; set({opt:+v}); break;
    case 'justify': S._keep=true; set({justificado:true,toast:'Justificativa enviada: desvio por acidente na SP-075'}); break;
    case 'save':
      var raw=(document.getElementById('valor')||{}).value||'';
      var n=parseFloat(raw.replace(/\./g,'').replace(',','.'));
      if(!(n>0)){var inp=document.getElementById('valor');inp.focus();inp.setAttribute('aria-invalid','true');inp.style.borderColor='var(--bad)';inp.placeholder='Informe o valor pago';return;}
      var sh=SHEETS[S.sheet], opt=sh.opts?' · '+sh.opts[S.opt]:'';
      var p={extra:[{type:sh.name,place:'BR-116, km 440 · Registro/SP',detail:'Lançado agora'+opt+(S.receipt?' · comprovante anexado':' · sem comprovante'),amount:n}].concat(S.extra),sheet:null,valor:'',tab:'despesas',toast:'Despesa enviada para aprovação'};
      if(S.sheet==='pern')p.jornada='descanso';
      set(p); break;
    case 'jornada': S._keep=true; set({jornada:v}); break;
    case 'screen': S.screen=v; render(); window.scrollTo(0,0); break;
    case 'susp': set({suspensos:!S.suspensos}); break;
    case 'programar': S.programada=true; ctoast('VG-0414 programada e enviada ao app do motorista'); break;
    case 'ctoast': ctoast(v); break;
    case 'closeCtoast': S.ctoast=''; render(); break;
    case 'avisoAna': S.avisoAna=true; ctoast('Aviso enviado. Ana Ribeiro iniciou a pausa.'); break;
    case 'res': S[el.getAttribute('data-k')]=v; ctoast(v==='contestado'?'Contestação de R$ 6,80 enviada à emissora da tag':v==='glosado'?'R$ 16,20 glosado do acerto do motorista':'Passagem aceita como custo da viagem'); break;
    case 'aprovar': S.aprovado=true; ctoast('Acerto aprovado e enviado ao financeiro'); break;
    case 'finishFromCentral': S.step=4; S.done=true; S.jornada='descanso'; render(); break;
  }
});
document.addEventListener('input',function(ev){ if(ev.target.id==='valor'){S.valor=ev.target.value;ev.target.style.borderColor='';} });
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='canhoto'&&t.files&&t.files.length){S._keep=true;set({canhoto:true});}
  if(t.id==='receipt'&&t.files&&t.files.length){S._keep=true;var val=(document.getElementById('valor')||{}).value;set({receipt:true,valor:val||S.valor});}
  if(t.id==='drv'){set({driver:t.value,programada:false});}
});
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'&&S.sheet){S._keep=true;set({sheet:null});} });
render();
})();
</script>

</body>
</html>
